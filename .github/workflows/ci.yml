name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # postinstall runs `prisma generate`, which the type checker needs for
      # Prisma.Decimal in src/lib/money.ts.
      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # AIDO §4: AI provider imports outside src/modules/ai/, and any AI
      # reference inside the AI-free zones, fail the build here.
      - name: AI boundary
        run: node scripts/check-ai-boundary.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Build-time placeholders — no real credentials are needed to compile.
          DATABASE_URL: postgresql://user:password@localhost:5432/cashcast
